[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coindcx-trading-bot"
version = "0.1.0"
description = "Paper-first CoinDCX futures trading bot scaffold"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
ws = [
  "python-socketio[client]>=5,<6",
]
ws-legacy = [
  "python-socketio[client]>=4.6,<5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[project.scripts]
paper = "app.live.run_paper:main"
